[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mundial-2030-sirius-engine"
version = "0.1.0"
description = "Motor reproducible y experimental para el escenario Mundial 2030 de 64 equipos"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14,<2",
  "celery>=5.4,<6",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pandas>=2.2,<4",
  "numpy>=1.26,<3",
  "pillow>=11,<13",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.7,<3",
  "redis>=5,<7",
  "reportlab>=4.2,<5",
  "requests>=2.32,<3",
  "beautifulsoup4>=4.12,<5",
  "pyswisseph>=2.10,<3; python_version < '3.14'",
  "pyyaml>=6,<7",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
astro = ["pyswisseph>=2.10,<3; python_version < '3.14'"]
legacy = ["plotly>=5.24,<7", "streamlit>=1.38,<2"]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "pytest-xdist>=3.6,<4",
  "ruff>=0.8,<1",
  "types-PyYAML>=6.0,<7",
  "types-requests>=2.32,<3",
]

[project.scripts]
sirius-api = "services.api.main:run"

[tool.setuptools.packages.find]
include = ["collectors*", "db*", "engine*", "packages*", "services*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "integration: requires integration infrastructure",
  "slow: full 100,000-run acceptance tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
follow_imports = "skip"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
exclude = ["^alembic/", "^engine/"]
