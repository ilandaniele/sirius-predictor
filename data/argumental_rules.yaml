version: argumental-rules-public-v1
status: experimental_not_scientifically_validated
weights_trained: false
source: Astrología Argumental — Santiago Rodríguez Spuch (@AstroArgumental, @astrologia.argumental)
source_url: https://astrologiaargumental.blogspot.com/
methodology_note: >
  Astrología tradicional y electiva aplicada a cartas evento (carta del partido) y cartas
  nacionales/de federación, distinta del enfoque de Sirius de combinar múltiples cartas
  natales (país, federación, DT, capitán). El técnica insignia es el "método Frawley"
  (analisis horario de la carta eventual del partido mediante significadores y aspectos).
